# Tests, builds and publishes Roomination to GitHub Pages on every push to main.
# Pushes to phase-* development branches run the same tests but never deploy.
# Free for public repositories; no secrets or API keys are needed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'phase-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Browser tests run against the dev server and the production build (under /Roomination/).
      - run: npx playwright install --with-deps chromium
      # 3D tests (tagged @3d) render WebGL in software, which saturates the CPU, so they run on
      # their own afterwards, one at a time, against the production build that gets deployed.
      # `npm run test:e2e` locally runs everything on both builds.
      - run: npx playwright test --grep-invert @3d
        env:
          CI: 'true'
      - run: npx playwright test --grep @3d --project=prod --workers=1
        env:
          CI: 'true'
      - run: npm run build
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
