<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Roomination — a free, private room planner. A little less guessing. A lot more room for living." />
    <meta name="theme-color" content="#fbf4ea" />
    <title>Roomination</title>
    <script>
      // Apply the saved theme before first paint so dark-mode users don't see a light flash.
      try {
        var pref = (JSON.parse(localStorage.getItem('roomination.preferences') || '{}') || {}).theme;
        var dark = pref === 'dark' || (pref !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
